race_day_protocol:
  - {time: "05:30", what: "Despertar i esmorzar", detail: "Pa blanc amb mel, plàtan i cafè: 90–100 g de carbohidrats. Res de fibra ni greix. 3 h abans."}
  - {time: "07:00", what: "A boxes", detail: "Muntar la caixa, comprovar pressions, canvi i bidó. Memoritzar entrada i sortida de la zona de transició."}
  - {time: "07:45", what: "Escalfament", detail: "10′ de trot molt suau, mobilitat d'espatlles, 4–5 progressius de 20″."}
  - {time: "08:10", what: "Últim avituallament", detail: "Un gel o 30 g de carbohidrats amb aigua. Crema solar. Xip."}
  - {time: "08:20", what: "Escalfament a l'aigua", detail: "Si el permeten: 5′ nedant i 4 acceleracions curtes."}
  - {time: "08:35", what: "Sortida", detail: "Col·locar-se al lateral i una mica endarrere."}

pacing_rules:
  swim: "Primers 100 m al 70 % i respirant llarg. Orientació cada 6–8 braçades. Sortir sense deute, no fer temps."
  t1:   "Mitjons sí. Casc cordat abans de tocar la bici."
  bike: "Primers 5 minuts suaus. Esforç «còmodament incòmode». No deixar de pedalar al cim. 40–60 g de carbohidrats, un glop cada 10′. Drafting prohibit: 12 m, avançar en menys de 20″."
  t2:   "Cinturó portadorsals: mitja volta."
  run:  "Primer km a 4:20–4:25; des del km 2, a 4:05–4:10. A la torre, mantenir intensitat i no ritme. Mullar-se el cap a cada avituallament."
