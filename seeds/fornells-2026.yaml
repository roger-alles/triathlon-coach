  health:
    knee: >
      Molèsties lleugeres al genoll (abril 2026): protuberància òssia palpable
      que fricciona quan força molt a la bici. Sense dolor persistent des de
      llavors; reapareix puntualment després d'excessos (p. ex. la bici llarga
      del 27/08/2026). No limitant a dia d'avui. El coach ha de vigilar-ho en
      sessions dures de bici i preguntar-ho després d'excessos.
      29/08: l'atleta confirma que el genoll està BÉ després de la bici
      llarga del 27/08 — cap fricció ni molèstia nova. Cames sense agulletes,
      només pesadesa matinal normal.
