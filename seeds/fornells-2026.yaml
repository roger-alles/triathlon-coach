# Aquest fitxer és la font de veritat inicial del sistema: carrega'l a `goal`,
# `plan_block` i `plan_session` amb un loader idempotent (`ingest/seed.py`).
# Els temps són en segons i les distàncies en metres, com a la base de dades.
schema_version: "1.1"
source: "artifact:747161a0 — Compte enrere a Fornells, 26/08/2026"

goal:
  name: "Artiem Half Menorca · Short — Fornells"
  discipline: triathlon
  event_date: 2026-09-27
  priority: A
  status: active
  profile:
    first_race_ever: true          # primer triatló de l'atleta: la logística importa tant com la forma
    start_time: "08:35"
    time_limit_sec: 14400
    location: "Fornells, Menorca"
    segments:
      - sport: swim
        distance_m: 1000
        venue: open_water
        wetsuit: "improbable"      # prohibit per sobre de 22 °C; badia a 23–25 °C al setembre
        notes: "Badia de Fornells, circuit circular"
      - sport: bike
        distance_m: 34000
        drafting_allowed: false    # 12 m de separació, 20 s per completar un avançament
        max_gradient_pct: 9.6
        notes: "Es Mercadal · Camí d'en Kane"
      - sport: run
        distance_m: 9000           # confirmat per l'atleta el 28/08/2026
        notes: "Ses Salines + pujada a la torre de Fornells"
    target_times_sec:
      #              conservador  objectiu  optimista
      swim:        [1560, 1380, 1200]
      t1:          [ 180,  135,  105]
      bike:        [3960, 3720, 3480]
      t2:          [  90,   70,   55]
      run:         [2320, 2160, 2065]
      total:       [8110, 7470, 6895]
      note: "Sector a peu confirmat a 9 km (28/08/2026): +500 m sobre els 8,5 previstos, ~+2 min per columna al ritme de cada escenari."
    emphasis:
      limiter: swim                # on l'entrenament encara canvia el resultat
      protect: run                 # arma de l'atleta: mantenir, no millorar
      rationale: >
        Amb 37:30 als 10 km ja és el millor corredor del seu propi triatló; en quatre
        setmanes córrer més no dona res i pot lesionar. Tot el creixement va a natació i bici.

athlete_context:
  known:
    birth_date: 2005-01-01
    run_10k_pr_sec: 2250           # 37:30 (10 km del 10/05/2026)
    max_hr_observed: 211           # registrat al mateix 10 km, canell Garmin — creïble per edat però no és un test
